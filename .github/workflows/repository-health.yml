name: Repository health

on:
  push:
    branches: [main]
    paths:
      - apps.json
      - schema/repository-inventory.schema.json
      - schema/repository-quality.schema.json
      - scripts/**
      - .github/workflows/repository-health.yml
  pull_request:
    branches: [main]
    paths:
      - apps.json
      - schema/repository-inventory.schema.json
      - schema/repository-quality.schema.json
      - scripts/**
      - .github/workflows/repository-health.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Check registered repositories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell syntax and UTF-8 preflight
        shell: pwsh
        run: ./scripts/check-powershell.ps1

      - name: Validate registry
        shell: pwsh
        run: ./scripts/check-registry.ps1

      - name: Build repository inventory
        shell: pwsh
        env:
          BROWSER_KITTY_GITHUB_TOKEN: ${{ secrets.BROWSER_KITTY_GITHUB_TOKEN }}
        run: ./scripts/check-repositories.ps1

      - name: Check repository assets and quality
        shell: pwsh
        env:
          BROWSER_KITTY_GITHUB_TOKEN: ${{ secrets.BROWSER_KITTY_GITHUB_TOKEN }}
        run: ./scripts/check-assets.ps1

      - name: Upload repository health reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-kitty-repository-health
          path: |
            reports/repository-inventory.json
            reports/repository-quality.json
          if-no-files-found: warn
          retention-days: 14
