name: Repository health

on:
  push:
    branches: [main]
    paths:
      - apps.json
      - categories.json
      - generated/**
      - VERSION
      - schema/**
      - scripts/**
      - .github/workflows/repository-health.yml
  pull_request:
    branches: [main]
    paths:
      - apps.json
      - categories.json
      - generated/**
      - VERSION
      - schema/**
      - scripts/**
      - .github/workflows/repository-health.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Check registered repositories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell syntax and UTF-8 preflight
        shell: pwsh
        run: ./scripts/check-powershell.ps1

      - name: Validate registry
        shell: pwsh
        run: ./scripts/check-registry.ps1

      - name: Verify public export is current
        shell: pwsh
        run: ./scripts/generate-public-export.ps1 -Check

      - name: Smoke test repository health report
        id: health-report-smoke
        continue-on-error: true
        shell: pwsh
        run: ./scripts/test-generate-report.ps1

      - name: Build repository inventory
        continue-on-error: true
        shell: pwsh
        env:
          BROWSER_KITTY_GITHUB_TOKEN: ${{ secrets.BROWSER_KITTY_GITHUB_TOKEN }}
        run: ./scripts/check-repositories.ps1

      - name: Check repository assets and quality
        continue-on-error: true
        shell: pwsh
        env:
          BROWSER_KITTY_GITHUB_TOKEN: ${{ secrets.BROWSER_KITTY_GITHUB_TOKEN }}
        run: ./scripts/check-assets.ps1

      - name: Check GitHub Pages reachability
        continue-on-error: true
        shell: pwsh
        run: ./scripts/check-pages.ps1

      - name: Check release and version consistency
        continue-on-error: true
        shell: pwsh
        env:
          BROWSER_KITTY_GITHUB_TOKEN: ${{ secrets.BROWSER_KITTY_GITHUB_TOKEN }}
        run: ./scripts/check-releases.ps1

      - name: Check standalone and runtime metadata
        continue-on-error: true
        shell: pwsh
        run: ./scripts/check-runtime.ps1

      - name: Generate repository health report
        if: always()
        shell: pwsh
        run: ./scripts/generate-report.ps1

      - name: Release readiness gate
        if: always()
        id: release-readiness
        continue-on-error: true
        shell: pwsh
        run: ./scripts/check-release-candidate.ps1 -RequireHealthReport

      - name: Upload repository health reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-kitty-repository-health
          path: |
            reports/repository-inventory.json
            reports/repository-quality.json
            reports/repository-pages.json
            reports/repository-releases.json
            reports/repository-runtime.json
            reports/repository-status.json
            reports/repository-status.md
            reports/release-candidate.json
            reports/release-candidate.md
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce health report smoke test result
        if: ${{ always() && steps.health-report-smoke.outcome != 'success' }}
        shell: pwsh
        run: throw 'Repository health report smoke test failed. See the earlier smoke-test step for details.'
      - name: Enforce release readiness gate result
        if: ${{ always() && steps.release-readiness.outcome != 'success' }}
        shell: pwsh
        run: throw 'Release readiness gate failed. See reports/release-candidate.md in the uploaded artifact.'
