name: Validate registry

on:
  push:
    branches: [main]
    paths:
      - apps.json
      - categories.json
      - schema/**
      - scripts/**
      - generated/**
      - VERSION
      - README.md
      - CHANGELOG.md
      - REGISTRY_SPEC.md
      - RELEASE_CHECKLIST.md
      - OPERATIONS.md
      - .github/workflows/validate-registry.yml
  pull_request:
    branches: [main]
    paths:
      - apps.json
      - categories.json
      - schema/**
      - scripts/**
      - generated/**
      - VERSION
      - README.md
      - CHANGELOG.md
      - REGISTRY_SPEC.md
      - RELEASE_CHECKLIST.md
      - OPERATIONS.md
      - .github/workflows/validate-registry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate apps registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell syntax and UTF-8 preflight
        shell: pwsh
        run: ./scripts/check-powershell.ps1

      - name: Validate registry
        shell: pwsh
        run: ./scripts/check-registry.ps1

      - name: Verify public export is current
        shell: pwsh
        run: ./scripts/generate-public-export.ps1 -Check

      - name: Smoke test repository health report
        shell: pwsh
        run: ./scripts/test-generate-report.ps1

      - name: Release readiness static gate
        shell: pwsh
        run: ./scripts/check-release-candidate.ps1
